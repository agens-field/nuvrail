name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Reused by release.yml so a tag is only released after the full CI below
  # passes on the tagged commit (tag pushes do not match `push.branches`).
  workflow_call:
  # Fly.io deployment lives in the private nuvrail-enterprise repo (it builds a
  # combined image from this core + the enterprise plugin). This repo is the
  # open self-host product; it only lints, tests, and validates the self-host
  # docker-compose build.

# Least privilege for GITHUB_TOKEN: both jobs below only checkout, lint, test,
# and build — neither writes to the repo. Pin the workflow default to read-only
# so a compromised build step or dependency cannot use the token to push,
# open issues, or alter releases. Mirrors staging-monitor.yml's explicit block.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Run tests
        # Run all tests except integration/e2e suites (those require real credentials).
        run: |
          python -m pytest \
            --ignore=tests/integration \
            --ignore=tests/e2e \
            --tb=short \
            -q

      # Blocking secrets gate (SOC2 control 2/6, 2026-09-09). Baseline is clean
      # in CI, so a leaked secret now FAILS the build instead of only warning
      # (the old `|| true` is gone). We install a pinned gitleaks binary rather
      # than relying on the runner having it — a silently-skipped scan is not a
      # gate. This runs the exact same `detect --no-git --config` invocation the
      # baseline was cleaned against, so CI matches local results.
      #
      # Download to a file (not a curl|tar pipe) so that:
      #   - an HTTP error fails loudly at curl (-f) instead of surfacing as
      #     "gzip: stdin: not in gzip format" (main went red on 2026-09-22 from
      #     exactly that: a transient release-download failure, tests green);
      #   - transient CDN errors are retried (--retry);
      #   - the archive is verified against a pinned SHA-256 before it is
      #     extracted onto PATH. A security gate should not execute a binary it
      #     has not integrity-checked. Checksum is the upstream value from
      #     gitleaks_8.21.2_checksums.txt; bump both lines together.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.21.2
          GITLEAKS_SHA256=5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Security scan (gitleaks)
        run: gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v

  # Validate the self-host docker-compose build (gateway + web) so a broken
  # Dockerfile is caught on PRs. No secrets — values are only baked into the
  # build image, never executed here.
  build:
    name: "Self-host image build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Provide a .env (compose requires the env_file to exist)
        run: cp .env.example .env

      - name: Build self-host images (docker compose build)
        run: docker compose build

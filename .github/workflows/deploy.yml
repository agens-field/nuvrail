name: Deploy

# Staging deploys automatically on every push to main (after the CI gate passes).
# Production deploys are always manual — triggered via workflow_dispatch only.
#
# Trigger → environment mapping:
#   push to main          → staging  (automatic)
#   workflow_dispatch     → staging or production (your choice)
#
# Flow:
#   1. CI gate (full test suite via ci.yml) — must pass before any deploy
#   2. Deploy gateway + web in parallel
#   3. If staging: E2E smoke tests run automatically post-deploy
#   4. Production: protected by the "production" GitHub Environment
#      (configure required reviewers in Settings → Environments → production)
#
# Environment → app/config matrix:
#
#   staging
#     gateway : nuvrail-staging-gateway   fly.staging-gateway.toml
#     web     : nuvrail-staging-web       web/fly.staging-web.toml
#
#   production
#     gateway : $FLY_MAIL_APP_PROD        fly.gateway.toml
#     web     : $FLY_WEB_APP_PROD         web/fly.toml
#
# Staging app names are hardcoded (not variables) to match the toml files
# and make the isolation guarantee explicit and auditable.
#
# Required GitHub secret:
#   FLY_API_TOKEN        — fly.io deploy token (set by Martin)
#
# Required GitHub variables (production only):
#   FLY_MAIL_APP_PROD    — gateway app name, e.g. nuvrail-mail
#   FLY_WEB_APP_PROD     — web app name,     e.g. nuvrail-app

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:

  # ── Gate: full test suite must pass before any deploy ─────────────────────
  ci:
    name: "CI gate"
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  # ── Deploy: gateway service ────────────────────────────────────────────────
  deploy-gateway:
    name: "Deploy gateway"
    needs: ci
    runs-on: ubuntu-latest
    # push → 'staging'; dispatch → use the input
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve deploy config
        id: cfg
        run: |
          ENV="${{ github.event_name == 'push' && 'staging' || inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "app=${{ vars.FLY_MAIL_APP_PROD }}" >> "$GITHUB_OUTPUT"
            echo "config=fly.gateway.toml"           >> "$GITHUB_OUTPUT"
          else
            echo "app=nuvrail-staging-gateway"       >> "$GITHUB_OUTPUT"
            echo "config=fly.staging-gateway.toml"   >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy gateway to fly.io
        run: |
          flyctl deploy \
            --app "${{ steps.cfg.outputs.app }}" \
            --config "${{ steps.cfg.outputs.config }}" \
            --remote-only \
            --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Deploy: web app ────────────────────────────────────────────────────────
  deploy-web:
    name: "Deploy web"
    needs: ci
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'push' && 'staging' || inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve deploy config
        id: cfg
        run: |
          ENV="${{ github.event_name == 'push' && 'staging' || inputs.environment }}"
          if [ "$ENV" = "production" ]; then
            echo "app=${{ vars.FLY_WEB_APP_PROD }}"                    >> "$GITHUB_OUTPUT"
            echo "config=fly.toml"                                      >> "$GITHUB_OUTPUT"
            echo "api_url=https://${{ vars.FLY_MAIL_APP_PROD }}.fly.dev" >> "$GITHUB_OUTPUT"
            echo "proxy_host=${{ vars.FLY_MAIL_APP_PROD }}.fly.dev"    >> "$GITHUB_OUTPUT"
          else
            echo "app=nuvrail-staging-web"                              >> "$GITHUB_OUTPUT"
            echo "config=fly.staging-web.toml"                         >> "$GITHUB_OUTPUT"
            echo "api_url=https://nuvrail-staging-gateway.fly.dev"     >> "$GITHUB_OUTPUT"
            echo "proxy_host=nuvrail-staging-gateway.fly.dev"          >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy web to fly.io
        # Must run from web/ so the Docker build context is correct.
        # nginx.conf, package.json etc. must be at the context root — they
        # live in web/, not the repo root. Config paths above are relative to web/.
        working-directory: web
        run: |
          flyctl deploy \
            --app "${{ steps.cfg.outputs.app }}" \
            --config "${{ steps.cfg.outputs.config }}" \
            --build-arg "VITE_API_URL=${{ steps.cfg.outputs.api_url }}" \
            --build-arg "VITE_PROXY_HOST=${{ steps.cfg.outputs.proxy_host }}" \
            --remote-only \
            --wait-timeout 300
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ── Post-deploy: E2E smoke tests (staging only) ───────────────────────────
  e2e:
    name: "E2E smoke (staging)"
    needs: [deploy-gateway, deploy-web]
    if: github.event_name == 'push' || inputs.environment == 'staging'
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

name: Staging Monitor

# Continuous E2E monitor against the DEPLOYED fly.io staging environment.
# Distinct from CI (which lints/tests the code in-process): this run hits the
# live staging gateway + web over the network on a schedule, so a silent
# staging regression is caught within one interval rather than at the next
# manual smoke test (#18 follow-on).
#
#   schedule (every 45 min)  ─► python -m tests.staging_smoke.runner
#       exit 0 = all green / only-skipped   ─► no-op
#       exit 1 = at least one check failed   ─► open/refresh an alert issue
#
# Secrets are injected at run time and never committed. With no secrets set,
# the public-surface + self-serve-lifecycle checks still run; the credentialed
# proxy checks report "skipped" (graceful degradation), not "failed".

on:
  schedule:
    - cron: "*/45 * * * *"   # every 45 minutes, UTC
  workflow_dispatch: {}       # allow manual runs

permissions:
  contents: read
  issues: write               # needed to file/refresh the alert issue

concurrency:
  group: staging-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime deps (httpx only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install httpx

      - name: Run staging monitor
        id: monitor
        env:
          # Override only if the staging app names change; defaults point at
          # the known staging apps. No secret values are required for the
          # public + self-serve checks.
          NUVRAIL_STAGING_GATEWAY_URL: ${{ vars.NUVRAIL_STAGING_GATEWAY_URL }}
          NUVRAIL_STAGING_WEB_URL: ${{ vars.NUVRAIL_STAGING_WEB_URL }}
          NUVRAIL_PROD_WEB_ORIGIN: ${{ vars.NUVRAIL_PROD_WEB_ORIGIN }}
          # Credentialed proxy checks activate only when these are present
          # (set as repo secrets by the enterprise deploy wiring).
          NUVRAIL_STAGING_MONITOR_IMAP_USER: ${{ secrets.NUVRAIL_STAGING_MONITOR_IMAP_USER }}
          NUVRAIL_STAGING_PROXY_IMAP_PORT: ${{ secrets.NUVRAIL_STAGING_PROXY_IMAP_PORT }}
        run: |
          set +e
          python -m tests.staging_smoke.runner > monitor-report.json 2> monitor.log
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat monitor.log
          echo "---- report ----"
          cat monitor-report.json

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-monitor-report
          path: |
            monitor-report.json
            monitor.log
          retention-days: 14

      - name: Alert on failure
        if: ${{ steps.monitor.outputs.exit_code != '0' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let report = '(report unavailable)';
            try { report = fs.readFileSync('monitor-report.json', 'utf8'); } catch (e) {}
            const title = 'Staging monitor failing';
            const body = [
              'The scheduled staging monitor reported at least one failed check.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '```json',
              report.slice(0, 60000),
              '```',
            ].join('\n');
            // Refresh a single open alert issue rather than spamming one per run.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'staging-monitor',
            });
            if (existing.data.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.data[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['staging-monitor'],
              });
            }

      - name: Fail the job if monitor failed
        if: ${{ steps.monitor.outputs.exit_code != '0' }}
        run: exit 1

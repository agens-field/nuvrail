# fly.io config — Nuvrail STAGING gateway (IMAP proxy + SMTP proxy + REST API)
#
# App: nuvrail-staging-gateway
# Pair: nuvrail-staging-web (see web/fly.staging-web.toml)
#
# ISOLATION GUARANTEE:
#   NUVRAIL_CORS_ORIGINS is set to https://nuvrail-staging-web.fly.dev only.
#   The web app is built with VITE_API_URL pointing at THIS app only.
#   These two apps are wired to each other and cannot accidentally reach production.
#
# Secrets to set once via flyctl (see staging-runbook.md):
#   NUVRAIL_MASTER_KEY      — staging-specific key (NEVER share with production)
#   NUVRAIL_VAPID_PRIVATE   — staging-specific VAPID private key PEM
#   NUVRAIL_VAPID_PUBLIC    — staging-specific VAPID public key PEM
#   LOOPS_API_KEY           — optional; omit if not using transactional email on staging

app = "nuvrail-staging-gateway"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.gateway"

[env]
  NUVRAIL_DATA_DIR     = "/data"
  NUVRAIL_IMAP_PORT    = "10143"
  NUVRAIL_SMTP_PORT    = "10587"
  PORT                 = "8080"
  # Restrict CORS to the staging web app only — never production.
  NUVRAIL_CORS_ORIGINS = "https://nuvrail-staging-web.fly.dev"

[[mounts]]
  source      = "nuvrail_staging_data"
  destination = "/data"

# ── REST API (HTTPS) ──────────────────────────────────────────────────────────
[[services]]
  internal_port      = 8080
  protocol           = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers    = ["http"]
    port        = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

# ── IMAP proxy (SSL, port 993) ────────────────────────────────────────────────
[[services]]
  internal_port        = 10143
  protocol             = "tcp"
  auto_stop_machines   = false   # IMAP is long-lived; never auto-stop
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls"]
    port     = 993

# ── SMTP proxy (SMTPS, port 465) ─────────────────────────────────────────────
[[services]]
  internal_port        = 10587
  protocol             = "tcp"
  auto_stop_machines   = false
  auto_start_machines  = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["tls"]
    port     = 465

# ── Health check — gates deploys ─────────────────────────────────────────────
[checks]
  [checks.api_health]
    port         = 8080
    type         = "http"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[project]
name = "nuvrail-gateway"
version = "0.1.0"
description = "IMAP Approval Gateway"
requires-python = ">=3.9"

dependencies = [
    "aioimaplib>=1.0.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "google-auth>=2.28.0",
    "google-auth-oauthlib>=1.2.0",
    "pywebpush>=2.0.0",
    "python-dotenv>=1.0.0",
    "aiosmtplib>=3.0.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-json-report>=1.5.0",
    "httpx>=0.27.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
norecursedirs = ["scripts", "web", "web/landing", ".venv", "node_modules"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["gateway*", "api*"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "127.0.0.1:10143:10143"   # IMAP proxy — localhost only; nginx stream provides TLS on :993
      - "127.0.0.1:10587:10587"   # SMTP proxy — localhost only; nginx stream provides TLS on :465
      - "127.0.0.1:8080:8080"     # REST API — localhost only; nginx/web proxies externally
    volumes:
      - nuvrail_data:/data
    env_file: .env
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: https://test.nuvrail.com
        VITE_PROXY_HOST: test.nuvrail.com
    ports:
      - "127.0.0.1:3000:80"       # Approval web app — localhost only; nginx proxies HTTPS
    depends_on:
      - gateway
    restart: unless-stopped

  # landing: moved to agens-field/nuvrail-internal (web/landing)
  # Build and run separately from that repo; nginx still proxies :3001 → HTTPS.

volumes:
  nuvrail_data:

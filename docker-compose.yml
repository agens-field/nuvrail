services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "127.0.0.1:10143:10143"   # IMAP proxy — localhost only; nginx stream provides TLS on :993
      - "127.0.0.1:10587:10587"   # SMTP proxy — localhost only; nginx stream provides TLS on :465
      - "127.0.0.1:8080:8080"     # REST API — localhost only; nginx/web proxies externally
    volumes:
      - nuvrail_data:/data
    env_file: .env
    restart: unless-stopped

  web:
    build:
      context: web
      dockerfile: Dockerfile.web
      args:
        # Point these at the gateway's externally-reachable URL/host (the
        # browser talks to it directly). Defaults work for local self-hosting.
        VITE_API_URL: http://localhost:8080
        VITE_PROXY_HOST: localhost
    ports:
      - "127.0.0.1:3000:80"       # Approval web app — localhost only; front with a TLS reverse proxy
    depends_on:
      - gateway
    restart: unless-stopped

volumes:
  nuvrail_data:

# fly.io config — Nuvrail STAGING web app (React PWA)
#
# App: nuvrail-staging-web
# Pair: nuvrail-staging-gateway (see fly.staging-gateway.toml)
#
# ISOLATION GUARANTEE:
#   VITE_API_URL and VITE_PROXY_HOST are baked into the build at deploy time,
#   pointing at nuvrail-staging-gateway.fly.dev only. There is no runtime
#   variable that can redirect this app to production — a rebuild is required.

app = "nuvrail-staging-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"
  # These build args wire this web app to its staging gateway partner.
  # Do not change these values without also updating fly.staging-gateway.toml.
  [build.args]
    VITE_API_URL    = "https://nuvrail-staging-gateway.fly.dev"
    VITE_PROXY_HOST = "nuvrail-staging-gateway.fly.dev"

[[services]]
  internal_port        = 80
  protocol             = "tcp"
  auto_stop_machines   = true
  auto_start_machines  = true
  min_machines_running = 0

  [[services.ports]]
    handlers    = ["http"]
    port        = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "requests"
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.http]
    port         = 80
    type         = "http"
    interval     = "30s"
    timeout      = "5s"
    grace_period = "5s"
    method       = "GET"
    path         = "/"

# fly.io config — Nuvrail web app (React SPA)
#
# App name and VITE_API_URL are injected at deploy time via --app and --build-arg
# in deploy.yml. Do not hardcode production values here.

app = "nuvrail-app-staging"   # placeholder — overridden by --app in CI
primary_region = "iad"

[build]
  dockerfile = "Dockerfile.web"
  # Build args are passed by deploy.yml; defaults below are for local builds.
  [build.args]
    VITE_API_URL = "https://nuvrail-mail-staging.fly.dev"
    VITE_PROXY_HOST = "nuvrail-mail-staging.fly.dev"

[[services]]
  internal_port = 80
  protocol = "tcp"
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[checks]
  [checks.http]
    port = 80
    type = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "5s"
    method = "GET"
    path = "/"
